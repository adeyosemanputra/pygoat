{% extends "introduction/base.html" %}
{% block content %} 

{% load crispy_forms_tags %}

<div style="display: flex; flex-direction: row; flex-wrap: wrap">
<div class="card mx-auto" style="width: 35rem; margin: 10px">
<div class="conatiner border border-info rounded">

	<!--Register--> 
	<div class="container py-5">
		<h1 style="color: #26282b;">Register</h1>
		<form method="POST">
			{% csrf_token %}
			{{ register_form|crispy }}                    
			<button class="btn btn-primary" type="submit">Register</button>
		</form>
		<br>
		<p style="color:#26282b;">If you already have an account, <a href="/login" style="color:#027bff">Login</a> instead.</p>
	</div>
</div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
	const passwordInputs = document.querySelectorAll('input[type="password"]');
	passwordInputs.forEach(function (input) {
		const wrapper = document.createElement('div');
		wrapper.style.position = 'relative';
		wrapper.style.width = '100%';
		input.parentNode.insertBefore(wrapper, input);
		wrapper.appendChild(input);

		input.style.paddingRight = '42px';

		const toggleBtn = document.createElement('button');
		toggleBtn.type = 'button';
		toggleBtn.title = 'Show/Hide Password';
		toggleBtn.setAttribute('aria-label', 'Toggle password visibility');
		toggleBtn.style.position = 'absolute';
		toggleBtn.style.right = '8px';
		toggleBtn.style.top = '50%';
		toggleBtn.style.transform = 'translateY(-50%)';
		toggleBtn.style.background = 'none';
		toggleBtn.style.border = 'none';
		toggleBtn.style.cursor = 'pointer';
		toggleBtn.style.color = '#6c757d';
		toggleBtn.style.padding = '4px 6px';
		toggleBtn.style.zIndex = '5';
		toggleBtn.innerHTML = '👁️';

		toggleBtn.addEventListener('click', function (e) {
			e.preventDefault();
			if (input.type === 'password') {
				input.type = 'text';
				toggleBtn.innerHTML = '🙈';
				toggleBtn.title = 'Hide Password';
			} else {
				input.type = 'password';
				toggleBtn.innerHTML = '👁️';
				toggleBtn.title = 'Show Password';
			}
		});

		wrapper.appendChild(toggleBtn);
	});
});
</script>

{% endblock %}
