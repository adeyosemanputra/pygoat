{% extends "introduction/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
{% load socialaccount %}
<div style="display: flex; flex-direction: row; flex-wrap: wrap">
 <div class="card mx-auto" style="width: 30rem;margin: 10px">
<div class="conatiner border border-info rounded">
    <h2 align="center" style="margin:20px; color: #26282b">Login</h2>
    
    <form method="post">
        <div class="login-form">
        {% csrf_token %}
        {{form|crispy}}
        </div>
        <div>
         </p>
        </div>
        <div class="text-center">
        <button type="submit" class="btn btn-info" style="margin:10px">Login</button>
        </div>
    </form>
    <div style="display:flex;justify-content: center;align-items: center; margin-bottom: 10px;" align="center" id="o-auth">
        
        <a href="/register" class="btn btn-primary" style="margin-left:7px; background: #2aa2b8;">Register</a>

        <form method="post" action="/accounts/google/login/">
             {% csrf_token %} 
            <button type="submit" class="btn btn-primary" style="margin-left:7px; background: #2aa2b8;">
                Login with Google
            </button>
        </form>
    </div>
</div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
	const passwordInputs = document.querySelectorAll('input[type="password"]');
	passwordInputs.forEach(function (input) {
		const wrapper = document.createElement('div');
		wrapper.style.position = 'relative';
		wrapper.style.width = '100%';
		input.parentNode.insertBefore(wrapper, input);
		wrapper.appendChild(input);

		input.style.paddingRight = '42px';

		const toggleBtn = document.createElement('button');
		toggleBtn.type = 'button';
		toggleBtn.title = 'Show/Hide Password';
		toggleBtn.setAttribute('aria-label', 'Toggle password visibility');
		toggleBtn.style.position = 'absolute';
		toggleBtn.style.right = '8px';
		toggleBtn.style.top = '50%';
		toggleBtn.style.transform = 'translateY(-50%)';
		toggleBtn.style.background = 'none';
		toggleBtn.style.border = 'none';
		toggleBtn.style.cursor = 'pointer';
		toggleBtn.style.color = '#6c757d';
		toggleBtn.style.padding = '4px 6px';
		toggleBtn.style.zIndex = '5';
		toggleBtn.innerHTML = '👁️';

		toggleBtn.addEventListener('click', function (e) {
			e.preventDefault();
			if (input.type === 'password') {
				input.type = 'text';
				toggleBtn.innerHTML = '🙈';
				toggleBtn.title = 'Hide Password';
			} else {
				input.type = 'password';
				toggleBtn.innerHTML = '👁️';
				toggleBtn.title = 'Show Password';
			}
		});

		wrapper.appendChild(toggleBtn);
	});
});
</script>

{% endblock %}
