<div class="modal fade" id="launchStatusModal" tabindex="-1" role="dialog" aria-labelledby="launchStatusModalLabel" aria-hidden="true" data-backdrop="static" data-keyboard="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="launchStatusModalLabel">Lab Status</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="text-center">
          <div class="modal-status">
            <div id="launch-status-spinner" class="loading-spinner text-primary" role="status" style="display: none;">
              <span class="sr-only">Loading...</span>
            </div>
            <p id="launch-status-msg" class="mt-3" role="status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-close" data-dismiss="modal" id="launch-modal-close-btn">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="manageStatusModal" tabindex="-1" role="dialog" aria-labelledby="manageStatusModalLabel" aria-hidden="true" data-backdrop="static" data-keyboard="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="manageStatusModalLabel">Manage Labs</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="text-center">
          <div class="modal-status">
            <div id="manage-status-spinner" class="loading-spinner text-primary" role="status" style="display: none;">
              <span class="sr-only">Loading...</span>
            </div>
            <p id="manage-status-msg" class="mt-3" role="status"></p>
          </div>
          <div id="manage-lab-list"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="manage-modal-stop-all-btn" style="display: none;">Stop All Labs</button>
        <button type="button" class="btn btn-close" data-dismiss="modal" id="manage-modal-close-btn">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="customLabsModal" tabindex="-1" role="dialog" aria-labelledby="customLabsModalLabel" aria-hidden="true" data-backdrop="static" data-keyboard="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="customLabsModalLabel">Custom Labs</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="custom-labs-alert" class="alert alert-dismissible fade show d-none" role="alert">
          <span id="custom-labs-alert-msg"></span>
        </div>

        <div class="card p-3 mb-4" style="background: #a9cfed2b; color: inherit;">
          <h6 class="card-title text-primary font-weight-bold" id="custom-lab-form-title">Add New Custom Lab</h6>
          <form id="custom-lab-form">
            <input type="hidden" id="custom-lab-id">
            <div class="form-row">
              <div class="form-group col-md-4">
                <label for="custom-lab-name">Name</label>
                <input type="text" class="form-control" id="custom-lab-name" required placeholder="e.g. my_custom_lab">
              </div>
              <div class="form-group col-md-5">
                <label for="custom-lab-build-location">Build Location</label>
                <input type="text" class="form-control" id="custom-lab-build-location" required placeholder="e.g. dockerized_labs/my_custom_lab">
              </div>
              <div class="form-group col-md-3">
                <label for="custom-lab-port">Port</label>
                <input type="number" class="form-control" id="custom-lab-port" required placeholder="e.g. 5000">
              </div>
            </div>
            <div class="d-flex justify-content-end">
              <button type="button" class="btn btn-secondary mr-2" id="custom-lab-cancel-btn" style="display: none;" onclick="resetCustomLabForm()">Cancel</button>
              <button type="submit" class="btn btn-primary" id="custom-lab-submit-btn">Add Lab</button>
            </div>
          </form>
        </div>

        <h6 class="text-primary font-weight-bold">Existing Custom Labs</h6>
        <div id="custom-labs-spinner" class="text-center my-3" style="display: none;">
          <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
          </div>
        </div>
        <div id="custom-labs-list-container" class="table-responsive">
          <table class="table table-striped table-bordered" style="color: inherit;">
            <thead>
              <tr>
                <th>Name</th>
                <th>Build Location</th>
                <th>Port</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="custom-labs-table-body">
            </tbody>
          </table>
          <p id="no-custom-labs-msg" class="text-muted text-center" style="display: none;">No custom labs registered yet.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
