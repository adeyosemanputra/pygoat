{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <button type="button" id="sidebarCollapse" class="btn btn-info">
      <i class="fas fa-align-left"></i>
      <span>Toggle Sidebar</span>
    </button>
    <button
      class="btn btn-dark d-inline-block d-lg-none ml-auto"
      type="button"
      data-toggle="collapse"
      data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <i class="fas fa-align-justify"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="nav navbar-nav ml-auto">
        <li class="nav-item">
          <button class="nav-link dark" href='{% url "logout" %}?next=/' id="stylesheet-toggle" onclick="swapStyleSheet()"
            >Theme</button
          >
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item">
          <button class="nav-link dark mr-2" onclick="openCustomLabsModal()" id="custom-labs-btn" style="background: #f0f8ff8a; border-radius: 2px; border: none;">
            Custom Labs
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link dark" onclick="manageLabs()" id="manage-labs-btn" style="background: #f0f8ff8a; border-radius: 2px; border: none;">
            Manage Labs
          </button>
        </li>
        <li class="nav-item">
          <a class="nav-link" href='{% url "logout" %}?next=/'
            >Logout</a
          >
        </li>

        {% else %}

        <li class="nav-item">
          <a class="nav-link" href="/login">Login</a>
        </li>
        {% endif %}

      </ul>
    </div>
  </div>
</nav>
