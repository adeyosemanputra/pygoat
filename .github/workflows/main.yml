name: Bandit Security Scan

on:
  push:

permissions:
  contents: read

jobs:
  bandit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install --upgrade bandit

      - name: Scan Python code with Bandit
        run: bandit -r . --exclude ./.venv,./venv
